<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha To Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Minha To Do List</h1>

    <!-- FORMULÁRIO -->
    <div class="formulario">

        <input
            type="text"
            id="inputTarefa"
            placeholder="Digite uma tarefa">

        <input
            type="date"
            id="dataTarefa">

        <select id="selectPrioridade">
            <option value="Alta">Alta</option>
            <option value="Media" selected>Média</option>
            <option value="Baixa">Baixa</option>
        </select>

        <button
            type="button"
            id="btnAdicionar">
            Adicionar
        </button>

    </div><input
    type="text"
    id="pesquisaTarefa"
    placeholder="Pesquisar tarefa...">
    <input
    type="date"
    id="filtroData">

<button onclick="filtrarPorData()">
    Buscar por Data
</button>

<button onclick="limparFiltroData()">
    Todas as Datas
</button>
    <!-- FILTROS -->

    <div class="filtros">

        <button onclick="mudarFiltro('todas')">
            Todas
        </button>

        <button onclick="mudarFiltro('pendentes')">
            Pendentes
        </button>

        <button onclick="mudarFiltro('concluidas')">
            Concluídas
        </button>

    </div>

    <!-- ESTATÍSTICAS -->

    <div id="estatisticas">

        <p>
            📋 Total:
            <span id="total">0</span>
        </p>

        <p>
            ⏳ Pendentes:
            <span id="pendentes">0</span>
        </p>

        <p>
            ✅ Concluídas:
            <span id="concluidas">0</span>
        </p>

    </div>

    <!-- LISTA DE TAREFAS -->

    <ul id="listaTarefas"></ul>

    <script src="script.js"></script>

</body>

</html>
